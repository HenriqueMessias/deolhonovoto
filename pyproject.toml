[project]
name = "deolhonovoto"
version = "0.1.0"
description = "Coleta da apuração do TSE e projeção do 2º turno em tempo real"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "numpy>=1.26", "pandas>=2.1", "pyarrow>=15"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
